<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0B2F40" />
  <title>Registro GOY XPRESS</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7f9;color:#17242d}.top{background:#0b2f40;color:white;padding:22px;text-align:center}.top h1{margin:0;font-size:24px}.top p{margin:7px 0 0;color:#c7d8e0}.wrap{max-width:720px;margin:28px auto;padding:0 16px}.card{background:white;border:1px solid #dce6eb;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(11,47,64,.06)}.notice{background:#e8f8fe;border-left:4px solid #00a9e8;padding:12px 14px;border-radius:8px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}input,textarea{width:100%;padding:12px;border:1px solid #cfdce3;border-radius:10px;font-size:15px}textarea{min-height:90px;resize:vertical}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:#38a844;color:white;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.msg{margin-top:14px;font-weight:700}.ok{color:#287b30}.err{color:#b33b3b}.hidden{display:none}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
  <header class="top"><h1>GOY XPRESS</h1><p>Registro seguro de cliente</p></header>
  <main class="wrap">
    <section class="card">
      <div id="loading" class="notice">Validando tu invitación…</div>
      <div id="invalid" class="notice hidden">Este enlace no es válido, ya fue utilizado o ha vencido.</div>
      <form id="form" class="hidden">
        <div class="notice">Completa tus datos para activar tu registro en GOY XPRESS.</div>
        <div class="grid">
          <div class="full"><label>Nombre completo o razón social *</label><input name="name" required /></div>
          <div><label>Número de WhatsApp *</label><input name="whatsapp" inputmode="tel" required /></div>
          <div><label>Teléfono de contacto *</label><input name="contactPhone" inputmode="tel" required /></div>
          <div><label>Cédula o RUC *</label><input name="documentId" required /></div>
          <div><label>Correo electrónico *</label><input name="email" type="email" required /></div>
          <div class="full"><label>Dirección *</label><textarea name="address" required></textarea></div>
        </div>
        <button id="submit" type="submit">Completar registro</button>
        <div id="message" class="msg"></div>
      </form>
    </section>
  </main>
<script>
(() => {
  const parts = location.pathname.split('/').filter(Boolean);
  const token = parts[0] === 'registro' ? parts[1] : '';
  const loading = document.getElementById('loading');
  const invalid = document.getElementById('invalid');
  const form = document.getElementById('form');
  const message = document.getElementById('message');
  const submit = document.getElementById('submit');

  async function validate(){
    if(!token){ loading.classList.add('hidden'); invalid.classList.remove('hidden'); return; }
    try{
      const res = await fetch(`/api/invite/${encodeURIComponent(token)}`, {cache:'no-store'});
      if(!res.ok) throw new Error();
      const data = await res.json();
      if(data.email) form.elements.email.value = data.email;
      loading.classList.add('hidden');
      form.classList.remove('hidden');
    }catch{
      loading.classList.add('hidden');
      invalid.classList.remove('hidden');
    }
  }

  form.addEventListener('submit', async e => {
    e.preventDefault(); message.textContent=''; submit.disabled=true;
    const body = Object.fromEntries(new FormData(form).entries());
    try{
      const res = await fetch(`/api/invite/${encodeURIComponent(token)}`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const data = await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.error || 'No se pudo completar el registro');
      message.className='msg ok'; message.textContent='Registro completado correctamente. Ya puedes cerrar esta página.';
      form.querySelectorAll('input,textarea,button').forEach(el=>el.disabled=true);
    }catch(err){
      message.className='msg err'; message.textContent=err.message || 'No se pudo completar el registro'; submit.disabled=false;
    }
  });
  validate();
})();
</script>
</body>
</html>
