name: Generar APK GOY XPRESS Mensajero

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'server/**'
      - 'api/**'
      - 'admin-web/**'
      - 'register.html'
      - 'package.json'
      - 'metro.config.js'
      - 'app.courier.json'
      - 'index.courier.js'
      - 'scripts/smoke-android.sh'
      - 'scripts/install-android-ndk.sh'
      - 'scripts/prefix-numeric-assets.js'
      - '.github/workflows/build-role-apks.yml'
  push:
    branches:
      - main

permissions:
  contents: read

env:
  EXPO_PUBLIC_GOY_API_URL: https://goy-xpress-app.kyrshopecu.workers.dev/api

jobs:
  build-mensajero:
    name: build-mensajero
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar caché Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Activar únicamente la app de mensajero
        run: |
          cp app.courier.json app.json
          cp index.courier.js index.js
          node -e "const c=require('./app.json').expo; if(!c.name.includes('Mensajero')) process.exit(1); console.log(c.name,c.android.package,c.version,c.android.versionCode)"
          echo "API móvil: $EXPO_PUBLIC_GOY_API_URL"

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas de negocio, cuentas, mapas y seguridad
        run: npm test

      - name: Validar bundle JavaScript de mensajero
        run: npm run export:android

      - name: Crear proyecto Android limpio
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Instalar y validar NDK Android
        run: bash scripts/install-android-ndk.sh 27.1.12297006

      - name: Compilar APK release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Preparar APK Mensajero
        run: cp android/app/build/outputs/apk/release/app-release.apk GOY-XPRESS-MENSAJERO.apk

      - name: Verificar firma y alineación
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 GOY-XPRESS-MENSAJERO.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs GOY-XPRESS-MENSAJERO.apk

      - name: Instalar y abrir en Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: timeout 420s bash scripts/smoke-android.sh GOY-XPRESS-MENSAJERO.apk smoke-mensajero

      - name: Compilar APK ARM64 liviana
        working-directory: android
        run: |
          ./gradlew clean assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Preparar APK ARM64
        run: cp android/app/build/outputs/apk/release/app-release.apk GOY-XPRESS-MENSAJERO-ARM64.apk

      - name: Verificar APK ARM64
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 GOY-XPRESS-MENSAJERO-ARM64.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs GOY-XPRESS-MENSAJERO-ARM64.apk

      - name: Guardar pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOY-XPRESS-MENSAJERO-PRUEBAS
          path: smoke-mensajero/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar APK verificada
        uses: actions/upload-artifact@v4
        with:
          name: GOY-XPRESS-MENSAJERO-APK
          path: GOY-XPRESS-MENSAJERO.apk
          if-no-files-found: error
          retention-days: 30

      - name: Guardar APK ARM64 liviana
        uses: actions/upload-artifact@v4
        with:
          name: GOY-XPRESS-MENSAJERO-APK-ARM64
          path: GOY-XPRESS-MENSAJERO-ARM64.apk
          if-no-files-found: error
          retention-days: 30
