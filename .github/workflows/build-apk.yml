name: Generar APK GOY XPRESS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_INVITE_BASE_URL: ${{ vars.EXPO_PUBLIC_INVITE_BASE_URL || 'goyxpress://register' }}
      EXPO_PUBLIC_ADMIN_LOGIN_DOMAIN: ${{ vars.EXPO_PUBLIC_ADMIN_LOGIN_DOMAIN || 'admin.goyxpress.app' }}

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar caché Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Verificar cálculos y paquete JavaScript
        run: |
          npm test
          npm run export:android

      - name: Crear proyecto Android limpio
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Compilar APK release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Preparar instalador GOY XPRESS
        run: cp android/app/build/outputs/apk/release/app-release.apk GOY-XPRESS-v3.2.0-SEGURA.apk

      - name: Verificar alineación y firma Android
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 GOY-XPRESS-v3.2.0-SEGURA.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs GOY-XPRESS-v3.2.0-SEGURA.apk

      - name: Verificar apertura real en Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: timeout 300s bash scripts/smoke-android.sh GOY-XPRESS-v3.2.0-SEGURA.apk smoke-test

      - name: Guardar evidencia de prueba Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOY-XPRESS-v3.2.0-PRUEBA-ANDROID
          path: smoke-test/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar instalador verificado
        uses: actions/upload-artifact@v4
        with:
          name: GOY-XPRESS-v3.2.0-SEGURA
          path: GOY-XPRESS-v3.2.0-SEGURA.apk
          if-no-files-found: error
          retention-days: 30
