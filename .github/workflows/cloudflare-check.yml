name: Cloudflare Worker check

on:
  pull_request:
    paths:
      - 'cloudflare-worker-v2.js'
      - 'cloudflare-entry.js'
      - 'cloudflare-entry-auth.js'
      - 'cloudflare-auth-proof.js'
      - 'cloudflare-login-v2.js'
      - 'cloudflare-password.mjs'
      - 'wrangler.jsonc'
      - 'server/**'
      - 'api/**'
      - 'public-web/**'
      - 'package.json'
      - '.github/workflows/cloudflare-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
