name: GOY XPRESS v4 - Cliente y Mensajero

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: goy-xpress-dual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm install
      - name: Probar backend y reglas
        run: npm test
      - name: Exportar ambas interfaces
        run: |
          npm run export:client
          npm run export:courier

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: client
            label: CLIENTE
            package: com.goyxpress.cliente
          - variant: courier
            label: MENSAJERO
            package: com.goyxpress.mensajero
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GOY_APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_GOY_APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_GOY_API_URL: https://goy-xpress-admin.vercel.app/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar dependencias
        run: npm install
      - name: Prebuild ${{ matrix.label }}
        run: CI=1 npx expo prebuild --platform android --clean
      - name: Compilar release
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Preparar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk GOY-XPRESS-${{ matrix.label }}-v4.0.0.apk
      - name: Verificar firma
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 GOY-XPRESS-${{ matrix.label }}-v4.0.0.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs GOY-XPRESS-${{ matrix.label }}-v4.0.0.apk
      - name: Instalar y abrir en Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: timeout 420s bash scripts/smoke-variant.sh GOY-XPRESS-${{ matrix.label }}-v4.0.0.apk ${{ matrix.package }} smoke-${{ matrix.variant }}
      - name: Guardar pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOY-XPRESS-${{ matrix.label }}-v4.0.0-PRUEBAS
          path: smoke-${{ matrix.variant }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: GOY-XPRESS-${{ matrix.label }}-v4.0.0
          path: GOY-XPRESS-${{ matrix.label }}-v4.0.0.apk
          if-no-files-found: error
          retention-days: 30
