name: Validar GOY IA Comercial
on:
  push:
    branches: [feature/goy-ia-comercial-v1, main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node server/run-goy-ia-tests.js
