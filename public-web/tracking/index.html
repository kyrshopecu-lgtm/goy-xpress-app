<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2f40"><title>Seguimiento GOY XPRESS</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef4f6;color:#132c38}.wrap{max-width:720px;margin:0 auto;padding:18px}.card{background:#fff;border-radius:20px;box-shadow:0 12px 38px rgba(11,47,64,.12);overflow:hidden}.head{background:#0b2f40;color:#fff;padding:20px;display:flex;gap:13px;align-items:center}.logo{width:54px;height:54px;border-radius:13px;object-fit:cover;background:#fff}.head h1{font-size:21px;margin:0}.head p{margin:4px 0 0;opacity:.78;font-size:13px}.body{padding:18px}.status{display:inline-flex;padding:7px 11px;border-radius:999px;background:#e6f7fc;color:#087895;font-size:12px;font-weight:800;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid #dce8ec;border-radius:13px;padding:12px}.item span{display:block;font-size:10px;color:#78909c;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}.item strong{font-size:14px;line-height:1.25;overflow-wrap:anywhere}.wide{grid-column:1/-1}.route-box{margin-top:16px;border:1px solid #dce8ec;border-radius:16px;padding:12px}.route-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.route-title h2{font-size:16px;margin:0}.route-title small{color:#78909c}.map{width:100%;height:300px;border-radius:13px;background:linear-gradient(180deg,#edf5f7,#f8fbfc);overflow:hidden;position:relative}.map svg{width:100%;height:100%;display:block}.empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#6f8089;font-size:13px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#5f747e;margin-top:8px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.start{background:#28a745}.end{background:#dc3545}.note{font-size:11px;color:#78909c;margin-top:14px;text-align:center}.loading,.error{padding:42px 18px;text-align:center}.error strong{display:block;margin-bottom:8px}@media(max-width:580px){.wrap{padding:0}.card{border-radius:0;min-height:100vh}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.map{height:260px}}</style></head><body><div class="wrap"><main class="card" id="app"><div class="loading">Cargando seguimiento…</div></main></div><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function routeSvg(points){if(!points.length)return '<div class="empty">El mensajero todavía no ha registrado puntos GPS para mostrar el recorrido.</div>';const xs=points.map(p=>p.longitude),ys=points.map(p=>p.latitude),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),pad=.0008,dx=Math.max(maxX-minX,pad),dy=Math.max(maxY-minY,pad),w=640,h=300,m=28;const coords=points.map(p=>{const x=m+((p.longitude-minX)/dx)*(w-m*2);const y=h-m-((p.latitude-minY)/dy)*(h-m*2);return [x,y]});const path=coords.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '),a=coords[0],b=coords[coords.length-1];return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Recorrido GPS del mensajero"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dce8ec" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#grid)"/><path d="${path}" fill="none" stroke="#00a9e8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${a[0]}" cy="${a[1]}" r="8" fill="#28a745" stroke="#fff" stroke-width="3"/><circle cx="${b[0]}" cy="${b[1]}" r="8" fill="#dc3545" stroke="#fff" stroke-width="3"/></svg>`}async function load(){const code=new URLSearchParams(location.search).get('code')||'';const app=document.getElementById('app');if(!code){app.innerHTML='<div class="error"><strong>Tracking no válido</strong>Escanea nuevamente el código QR.</div>';return}try{const res=await fetch('/api/public-tracking?code='+encodeURIComponent(code));const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.error||'No se pudo consultar');const r=body.request||{},pts=Array.isArray(r.gps?.history)?r.gps.history:[];if(!pts.length&&r.gps?.last)pts.push(r.gps.last);app.innerHTML=`<header class="head"><img class="logo" src="/assets/goy-logo.jpg" alt="GOY XPRESS"><div><h1>GOY XPRESS</h1><p>Seguimiento de orden</p></div></header><section class="body"><div class="status">${esc(r.status)}</div><div class="grid"><div class="item"><span>Tracking</span><strong>${esc(r.tracking)}</strong></div><div class="item"><span>Orden</span><strong>${esc(r.order)}</strong></div><div class="item"><span>Cliente</span><strong>${esc(r.client)}</strong></div><div class="item"><span>Mensajero</span><strong>${esc(r.courier)}</strong></div><div class="item wide"><span>Origen</span><strong>${esc(r.origin||'No registrado')}</strong></div><div class="item wide"><span>Destino</span><strong>${esc(r.destination||'No registrado')}</strong></div></div><div class="route-box"><div class="route-title"><h2>Ruta realizada por el mensajero</h2><small>${pts.length} punto(s) GPS</small></div><div class="map">${routeSvg(pts)}</div><div class="legend"><span><i class="dot start"></i>Inicio</span><span><i class="dot end"></i>Última ubicación</span></div></div><p class="note">Vista pública con información básica. Los datos privados del cliente no se muestran.</p></section>`}catch(e){app.innerHTML=`<div class="error"><strong>No se pudo abrir el seguimiento</strong>${esc(e.message||'Intenta nuevamente.')}</div>`}}load();</script></body></html>
